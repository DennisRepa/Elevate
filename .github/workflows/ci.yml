name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  integration-pnpm:
    name: pnpm integration (pnpm ${{ matrix.pnpm }})
    strategy:
      fail-fast: false
      matrix:
        pnpm: ['9', 'latest']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup pnpm
        run: npm install --global pnpm@${{ matrix.pnpm }}

      - name: Install dependencies
        run: npm ci

      - name: pnpm integration tests
        run: npx vitest run --config vitest.integration.config.ts test/integration/pnpm.test.ts test/integration/pnpm-cli.test.ts
