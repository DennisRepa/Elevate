name: Release

# Called by release-please.yml after the release pull request was merged. The tag
# and the GitHub release (with its notes) already exist; this workflow verifies the
# tag, builds the binaries and attaches them to the release.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v1.4.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Verify tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - name: Compare versions
        env:
          TAG: ${{ inputs.tag }}
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${PKG}"
            exit 1
          fi

  build-binaries:
    name: Build Binary (${{ matrix.os }}-${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: x64
            binary_name: elevate-windows-x64.exe
            archive_name: elevate-windows-x64.zip
          - runner: ubuntu-latest
            os: linux
            arch: x64
            binary_name: elevate-linux-x64
            archive_name: elevate-linux-x64.tar.gz
          - runner: macos-latest
            os: darwin
            arch: arm64
            binary_name: elevate-darwin-arm64
            archive_name: elevate-darwin-arm64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 'latest'
          check-latest: true

      - run: npm ci
      - run: npm run build:binary

      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ matrix.binary_name }}" -DestinationPath "dist/${{ matrix.archive_name }}"

      - name: Package Binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            codesign --sign - dist/${{ matrix.binary_name }} || true
          fi
          chmod +x dist/${{ matrix.binary_name }}
          tar -czvf dist/${{ matrix.archive_name }} -C dist ${{ matrix.binary_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: dist/${{ matrix.archive_name }}

  github-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: release-assets/*
